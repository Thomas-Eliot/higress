apiVersion: v1
kind: Pod
metadata:
  name: mock-llm
  namespace: ls-test
  labels:
    app: mock-llm
spec:
  containers:
  - name: mock-llm
    image: registry.cn-hangzhou.aliyuncs.com/aliyun_China/python:3.11-slim
    command: ["python", "-c"]
    args:
    - |
      import json, uuid, time
      from http.server import HTTPServer, BaseHTTPRequestHandler

      FILLER = "the quick brown fox jumps over the lazy dog mock response token test".split()

      def fill(prompt, n):
          words = prompt.split() or FILLER
          result = []
          while len(result) < n:
              result.extend(words)
          return " ".join(result[:n])

      class H(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == "/health":
                  self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
              else:
                  self.send_response(404); self.end_headers()

          def do_POST(self):
              if self.path not in ("/v1/chat/completions", "/chat/completions"):
                  self.send_response(404); self.end_headers(); return
              cl = int(self.headers.get("Content-Length", 0))
              body = json.loads(self.rfile.read(cl) if cl > 0 else b"{}")
              n = int(self.headers.get("X-Mock-Tokens", "50"))
              stream = body.get("stream", False)
              msgs = body.get("messages", [])
              prompt = next((m.get("content","") for m in reversed(msgs) if m.get("role")=="user"), "mock")
              pt = max(1, len(prompt.split()))
              content = fill(prompt, n)
              model = body.get("model", "mock-llm")
              print(f"[mock] pt={pt} ct={n} stream={stream}", flush=True)
              if stream:
                  self.send_response(200)
                  self.send_header("Content-Type","text/event-stream")
                  self.send_header("Cache-Control","no-cache")
                  self.end_headers()
                  words = content.split(); cs = max(1, len(words)//10); cid = uuid.uuid4().hex[:8]
                  for i in range(0, len(words), cs):
                      piece = " ".join(words[i:i+cs]) + " "
                      self.wfile.write(f'data: {json.dumps({"id":f"chatcmpl-{cid}","object":"chat.completion.chunk","created":int(time.time()),"model":model,"choices":[{"index":0,"delta":{"content":piece},"finish_reason":None}]})}\n\n'.encode())
                      self.wfile.flush()
                  self.wfile.write(f'data: {json.dumps({"id":f"chatcmpl-{cid}","object":"chat.completion.chunk","created":int(time.time()),"model":model,"choices":[{"index":0,"delta":{},"finish_reason":"stop"}],"usage":{"prompt_tokens":pt,"completion_tokens":n,"total_tokens":pt+n}})}\n\n'.encode())
                  self.wfile.write(b"data: [DONE]\n\n"); self.wfile.flush()
              else:
                  resp = {"id":f"chatcmpl-{uuid.uuid4().hex[:8]}","object":"chat.completion","created":int(time.time()),"model":model,"choices":[{"index":0,"message":{"role":"assistant","content":content},"finish_reason":"stop"}],"usage":{"prompt_tokens":pt,"completion_tokens":n,"total_tokens":pt+n}}
                  data = json.dumps(resp).encode()
                  self.send_response(200)
                  self.send_header("Content-Type","application/json")
                  self.send_header("Content-Length",str(len(data)))
                  self.end_headers(); self.wfile.write(data)

          def log_message(self, *a): pass

      print("Mock LLM on :8080", flush=True)
      HTTPServer(("0.0.0.0", 8080), H).serve_forever()
    ports:
    - containerPort: 8080
    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 3
      periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: ls-test
spec:
  selector:
    app: mock-llm
  ports:
  - port: 80
    targetPort: 8080
